<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Cake For You</title>
<style>
  :root {
    --paper: #fff9ee;
    --ink: #3b2a2a;
    --pink: #ff9fb8;
    --cream: #fff3d6;
    --berry: #e8456b;
    --flame: #ffb627;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #2a2030; --ink: #fff0e0; --cream: #5a4560; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Patrick Hand", "Comic Sans MS", "Marker Felt", cursive;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 16px;
    background-image: radial-gradient(rgba(0,0,0,.06) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  h1 { font-size: clamp(1.8rem, 6vw, 3rem); margin: 0 0 8px; }
  p  { font-size: 1.2rem; margin: 8px 0 0; min-height: 1.6em; }
  svg { width: min(86vw, 380px); height: auto; overflow: visible; }
  .line { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
  .draw { fill: none; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.2s ease forwards; }
  .d1 { animation-delay: .1s } .d2 { animation-delay: .7s } .d3 { animation-delay: 1.3s }
  .d4 { animation-delay: 1.9s } .d5 { animation-delay: 2.4s }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .fill { opacity: 0; animation: pop .6s ease forwards; }
  .f1 { animation-delay: 1s } .f2 { animation-delay: 1.6s } .f3 { animation-delay: 2.2s } .f4 { animation-delay: 2.7s }
  @keyframes pop { to { opacity: 1; } }
  .flame { transform-origin: center bottom; transform-box: fill-box; animation: flicker .5s ease-in-out infinite alternate; }
  @keyframes flicker { from { transform: scale(1) rotate(-3deg); } to { transform: scale(1.12) rotate(3deg); } }
  .flame-wrap { opacity: 0; animation: pop .4s ease 3s forwards; }
  button {
    margin-top: 18px; font: inherit; font-size: 1.15rem; color: var(--ink);
    background: var(--flame); border: 3px solid var(--ink); border-radius: 14px;
    padding: 8px 22px; cursor: pointer;
  }
  button:focus-visible { outline: 3px solid var(--berry); outline-offset: 3px; }
  .confetti { position: fixed; top: -12px; width: 10px; height: 14px; animation: fall linear forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) {
    .draw, .fill, .flame-wrap { animation: none; stroke-dashoffset: 0; opacity: 1; }
    .flame { animation: none; }
  }
</style>
</head>
<body>
  <h1 id="title">Happy Birthday!</h1>

  <svg viewBox="0 0 300 300" role="img" aria-label="A hand-drawn doodle cake with three candles">
    <!-- plate -->
    <path class="line draw d1" pathLength="1" d="M30 262 Q150 282 270 262"/>
    <!-- bottom tier -->
    <path class="fill f1" fill="var(--cream)" d="M55 225 L245 225 L245 255 Q150 270 55 255 Z"/>
    <path class="line draw d1" pathLength="1" d="M55 190 L55 255 Q150 272 245 255 L245 190"/>
    <!-- top tier -->
    <path class="fill f2" fill="var(--pink)" d="M85 150 L215 150 L215 190 L85 190 Z"/>
    <path class="line draw d2" pathLength="1" d="M85 150 L85 190 M215 150 L215 190"/>
    <!-- frosting drips -->
    <path class="line draw d3" pathLength="1" d="M55 190 Q75 215 95 190 Q115 220 135 190 Q155 215 175 190 Q195 222 215 190 Q230 208 245 190"/>
    <path class="line draw d3" pathLength="1" d="M85 150 Q150 135 215 150"/>
    <!-- sprinkles -->
    <g class="fill f3" stroke-width="4" stroke-linecap="round">
      <path d="M100 232 l8 -4" stroke="#e8456b"/><path d="M130 245 l7 5" stroke="#3a8fd9"/>
      <path d="M165 235 l8 -3" stroke="#ffb627"/><path d="M200 244 l7 5" stroke="#e8456b"/>
      <path d="M225 232 l6 -5" stroke="#3a8fd9"/><path d="M110 168 l8 -3" stroke="#ffb627"/>
      <path d="M150 172 l7 5" stroke="#3a8fd9"/><path d="M190 168 l8 -3" stroke="#e8456b"/>
    </g>
    <!-- cherry-ish hearts on top -->
    <path class="fill f4" fill="var(--berry)" d="M150 140 C132 124 148 112 150 124 C152 112 168 124 150 140 Z"/>
    <!-- candles -->
    <g class="line draw d4" pathLength="1">
      <path d="M115 148 L115 108 M150 124 L150 84 M185 148 L185 108" />
    </g>
    <g class="flame-wrap">
      <path class="flame" fill="var(--flame)" stroke="var(--ink)" stroke-width="3" d="M115 104 C106 94 115 84 115 80 C120 88 124 96 115 104 Z"/>
      <path class="flame" fill="var(--flame)" stroke="var(--ink)" stroke-width="3" d="M150 80 C141 70 150 60 150 56 C155 64 159 72 150 80 Z"/>
      <path class="flame" fill="var(--flame)" stroke="var(--ink)" stroke-width="3" d="M185 104 C176 94 185 84 185 80 C190 88 194 96 185 104 Z"/>
    </g>
  </svg>

  <p id="msg">Made just for you</p>
  <button id="btn" type="button">Make a wish</button>

<script>
  // ✏️ CHANGE THESE TWO LINES to personalize the gift
  const TITLE = "Happy Birthday!";
  const MESSAGE = "Made just for you";

  document.getElementById("title").textContent = TITLE;
  document.getElementById("msg").textContent = MESSAGE;

  const colors = ["#ff9fb8", "#ffb627", "#e8456b", "#3a8fd9", "#7bd88f"];
  document.getElementById("btn").addEventListener("click", () => {
    document.getElementById("msg").textContent = "Your wish is on its way";
    for (let i = 0; i < 60; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colors[i % colors.length];
      c.style.animationDuration = 2 + Math.random() * 2.5 + "s";
      c.style.animationDelay = Math.random() * 0.6 + "s";
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 5500);
    }
  });
</script>
</body>
</html>
